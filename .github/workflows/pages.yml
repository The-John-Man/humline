name: Deploy static demo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install and build
        working-directory: app
        run: |
          npm ci
          npm run build -- --base=/humline/
      - name: SPA fallback for GitHub Pages
        working-directory: app
        run: |
          cp dist/index.html dist/404.html
          # Project Pages soft-404 is unreliable; publish /demo as a real path.
          mkdir -p dist/demo
          cp dist/index.html dist/demo/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
