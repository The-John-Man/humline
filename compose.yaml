# Local development database only. Production uses a managed PostgreSQL connection.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: humline
      POSTGRES_PASSWORD: local-development-only
      POSTGRES_DB: humline
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - humline-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U humline -d humline"]
      interval: 5s
      retries: 10
volumes:
  humline-postgres:
